document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

14615C;\">MEDIUM<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 14px 0 0; font-size: 15.5px; line-height: 1.5; font-weight: 500;\">Pinto, black and kidney beans cooked down slow in a thick homemade enchilada sauce, melted cheese, heirloom tomatoes, green onions, cilantro if you want it.<\u002Fp>\n          <p style=\"margin: 12px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.2; color: #14615C;\">Goes the distance, as advertised.<\u002Fp>\n        <\u002Farticle>\n\n        <article data-reveal=\"1\" style=\"display: flex; flex-direction: column; transition: transform 0.24s ease;\" style-hover=\"transform: translateY(-6px);\">\n          <div style=\"position: relative; aspect-ratio: 4 / 3; background: #F7C93F; border: 1px solid #191510;\">\n            <span style=\"position: absolute; left: 13px; bottom: 11px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.12em; font-weight: 700; opacity: 0.5;\">MAC N CHEEZ / PHOTO<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 18px 0 10px; border-bottom: 1px solid rgba(25,21,16,0.22);\">\n            <h3 style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(25px, 2.6vw, 37px); line-height: 0.95; letter-spacing: -0.035em;\">MAC N CHEEZ<\u002Fh3>\n            <span style=\"flex: 0 0 auto; font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; opacity: 0.5;\">MILD<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 14px 0 0; font-size: 15.5px; line-height: 1.5; font-weight: 500;\">Creamy bronze-cut pasta in a béchamel base, aged cheddar and gruyère, crispy breadcrumb top, fresh thyme.<\u002Fp>\n          <p style=\"margin: 12px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.2; opacity: 0.75;\">Crunch outside, molten all the way in.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"wildcard\" style=\"background: #191510; color: #FBF3E2; padding: clamp(52px, 7vw, 108px) clamp(16px, 3vw, 44px);\">\n    <div style=\"max-width: 1380px; margin: 0 auto;\">\n      <div data-reveal=\"1\" style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 22px; margin-bottom: clamp(32px, 4.4vw, 58px);\">\n        <h2 style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(38px, 7.4vw, 124px); line-height: 0.84; letter-spacing: -0.05em; text-transform: uppercase;\">THE WILDCARD.<\u002Fh2>\n        <p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: clamp(11px, 1.1vw, 13.5px); font-weight: 700; letter-spacing: 0.12em; color: #F7C93F;\">ONE MORE FLAVOUR · NEW EVERY MONTH<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: clamp(26px, 3.4vw, 56px); align-items: center; padding-bottom: clamp(32px, 4.4vw, 56px); border-bottom: 1px solid rgba(251,243,226,0.22);\">\n        <div style=\"min-width: 0; display: flex; justify-content: center;\">\n          <div style=\"position: relative; width: 100%; max-width: 460px; aspect-ratio: 5 / 4; background: rgba(251,243,226,0.09); border: 1px solid rgba(251,243,226,0.28);\">\n            <span style=\"position: absolute; left: 13px; bottom: 11px; font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.12em; font-weight: 700; opacity: 0.55;\">¡AY, CARAMBA! / PHOTO<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-width: 0;\">\n          <p style=\"display: inline-flex; align-items: center; gap: 8px; margin: 0 0 16px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; font-weight: 700; color: #F7C93F;\"><span data-motion=\"1\" style=\"display: inline-block; width: 7px; height: 7px; border-radius: 999px; background: #F7C93F; animation: gf-pulse 2.4s ease-in-out infinite;\"><\u002Fspan>ON NOW · DROP 01<\u002Fp>\n          <h3 style=\"margin: 0 0 14px; font-family: 'Archivo Black', sans-serif; font-size: clamp(32px, 4.4vw, 68px); line-height: 0.9; letter-spacing: -0.045em;\">¡AY, CARAMBA!<\u002Fh3>\n          <p style=\"margin: 0 0 16px; max-width: 480px; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.5; opacity: 0.88;\">A luxurious cinnamon scroll folded right in — cream cheese, generous cinnamon, soft enough it melts on the way down.<\u002Fp>\n          <p style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: clamp(21px, 2.2vw, 32px); line-height: 1.16; color: #FF5A2B;\">Yes, it's breakfast. Yes, it's dessert.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: clamp(20px, 2.6vw, 40px); padding: clamp(28px, 3.6vw, 48px) 0;\">\n        <div data-reveal=\"1\">\n          <p style=\"margin: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; font-weight: 700; opacity: 0.5;\">NEXT · DROP 02<\u002Fp>\n          <h4 style=\"margin: 0 0 8px; font-family: 'Archivo Black', sans-serif; font-size: clamp(21px, 2.1vw, 30px); line-height: 0.95; letter-spacing: -0.03em;\">EN PAZ<\u002Fh4>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.5; opacity: 0.78;\">Sharp cheddar, fresh mozzarella and gruyère, roasted red peppers, onions two ways — caramelized soft, then frizzled crisp — a crack of black pepper. Quiet, molten, deeply calming.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\">\n          <p style=\"margin: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; font-weight: 700; opacity: 0.5;\">THEN · DROP 03<\u002Fp>\n          <h4 style=\"margin: 0 0 8px; font-family: 'Archivo Black', sans-serif; font-size: clamp(21px, 2.1vw, 30px); line-height: 0.95; letter-spacing: -0.03em;\">HONGOS<\u002Fh4>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.5; opacity: 0.78;\">Cremini, oyster, porcini and shiitake sautéed hard with garlic and thyme, balsamic reduction, gruyère, spinach and arugula. Deep, earthy, borderline meaty.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\">\n          <p style=\"margin: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; font-weight: 700; opacity: 0.5;\">IN THE ROTATION<\u002Fp>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.6; opacity: 0.78;\">Verde Madre. Pesto Change-O. Guac n Roll. Manzana Mía. Mangia. Popeye. Cheesyburgerito. Desi Gurl. Baegopang. Yes Iyah. The Picnic. <span style=\"opacity: 0.6;\">Twelve waiting for their month.<\u002Fspan><\u002Fp>\n          <p style=\"margin: 14px 0 0; padding-top: 12px; border-top: 1px solid rgba(251,243,226,0.2); font-size: 15px; line-height: 1.5; opacity: 0.78;\"><span style=\"font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; font-weight: 700; color: #F7C93F;\">POBLANO SEASON<\u002Fspan><br>One month a year, every tortilla goes green — roasted poblano folded into the 72-hour dough. Every flavour, all month, then it's gone.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: #14615C; color: #FBF3E2; padding: clamp(34px, 4.4vw, 62px) clamp(16px, 3vw, 44px);\">\n    <div data-reveal=\"1\" style=\"max-width: 1380px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: clamp(20px, 2.6vw, 44px); align-items: center;\">\n      <div>\n        <p style=\"margin: 0 0 10px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; font-weight: 700; opacity: 0.7;\">/ EVERY FLAVOUR, SAME PRICE<\u002Fp>\n        <h2 style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(26px, 3.4vw, 52px); line-height: 0.92; letter-spacing: -0.04em; text-transform: uppercase;\">GOING VEGAN?<br>SWAP THE OMULET.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: clamp(15px, 1.4vw, 17.5px); line-height: 1.55; opacity: 0.9;\">A moist silken tofu omulet — chickpea flour and aquafaba, cornstarch, plenty of fat, nutritional yeast for the umami — with vegan cheese or cashew crema wherever the dairy was. Same fold, same fillings, no upcharge.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"made\" style=\"padding: clamp(52px, 7vw, 108px) clamp(16px, 3vw, 44px);\">\n    <div style=\"max-width: 1380px; margin: 0 auto;\">\n      <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: clamp(24px, 3vw, 54px); align-items: end; margin-bottom: clamp(36px, 4.6vw, 64px);\">\n        <h2 style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(38px, 7vw, 116px); line-height: 0.84; letter-spacing: -0.05em; text-transform: uppercase;\">72 HOURS<br>BEFORE<br>YOU EAT IT.<\u002Fh2>\n        <p style=\"margin: 0; max-width: 440px; font-size: clamp(16px, 1.5vw, 20px); line-height: 1.5; font-weight: 500; text-wrap: pretty;\">The tortilla takes three days, which is why we only open three days a week. The dough sets the schedule, not us.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(215px, 100%), 1fr)); gap: 0;\">\n        <div data-reveal=\"1\" style=\"padding: clamp(20px, 2.2vw, 28px) clamp(18px, 2vw, 26px) clamp(22px, 2.4vw, 32px) 0; border-top: 1.5px solid #191510;\">\n          <p style=\"margin: 0 0 14px; font-family: 'Archivo Black', sans-serif; font-size: clamp(30px, 3.4vw, 46px); line-height: 0.9; letter-spacing: -0.04em; color: #FF5A2B;\">01<\u002Fp>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo Black', sans-serif; font-size: 17px; letter-spacing: -0.015em;\">MIX &amp; REST<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.5; opacity: 0.8;\">Organic stone-milled flour, live starter, sea salt, water. Nothing else.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"padding: clamp(20px, 2.2vw, 28px) clamp(18px, 2vw, 26px) clamp(22px, 2.4vw, 32px) 0; border-top: 1.5px solid #191510;\">\n          <p style=\"margin: 0 0 14px; font-family: 'Archivo Black', sans-serif; font-size: clamp(30px, 3.4vw, 46px); line-height: 0.9; letter-spacing: -0.04em; color: #FF5A2B;\">02<\u002Fp>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo Black', sans-serif; font-size: 17px; letter-spacing: -0.015em;\">COLD FERMENT<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.5; opacity: 0.8;\">72 hours at 4°C. Slow, sour, and strong enough to hold everything shut.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"padding: clamp(20px, 2.2vw, 28px) clamp(18px, 2vw, 26px) clamp(22px, 2.4vw, 32px) 0; border-top: 1.5px solid #191510;\">\n          <p style=\"margin: 0 0 14px; font-family: 'Archivo Black', sans-serif; font-size: clamp(30px, 3.4vw, 46px); line-height: 0.9; letter-spacing: -0.04em; color: #FF5A2B;\">03<\u002Fp>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo Black', sans-serif; font-size: 17px; letter-spacing: -0.015em;\">PRESS &amp; FOLD<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.5; opacity: 0.8;\">Pressed to order, griddled, wrapped around a hand-folded omulet.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"padding: clamp(20px, 2.2vw, 28px) clamp(18px, 2vw, 26px) clamp(22px, 2.4vw, 32px) 0; border-top: 1.5px solid #191510;\">\n          <p style=\"margin: 0 0 14px; font-family: 'Archivo Black', sans-serif; font-size: clamp(30px, 3.4vw, 46px); line-height: 0.9; letter-spacing: -0.04em; color: #FF5A2B;\">04<\u002Fp>\n          <h3 style=\"margin: 0 0 8px; font-family: 'Archivo Black', sans-serif; font-size: 17px; letter-spacing: -0.015em;\">FOIL, THEN TUBE<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.5; opacity: 0.8;\">Foiled while it's steaming, slid into a paper tube. One-handed. No plastic.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: clamp(14px, 1.8vw, 24px); margin-top: clamp(30px, 4vw, 52px);\">\n        <div style=\"position: relative; aspect-ratio: 3 / 4; background: rgba(25,21,16,0.055); border: 1px solid rgba(25,21,16,0.2);\"><span style=\"position: absolute; left: 12px; bottom: 10px; font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; font-weight: 700; opacity: 0.45;\">DOUGH / DAY 3<\u002Fspan><\u002Fdiv>\n        <div style=\"position: relative; aspect-ratio: 3 / 4; background: rgba(25,21,16,0.055); border: 1px solid rgba(25,21,16,0.2);\"><span style=\"position: absolute; left: 12px; bottom: 10px; font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; font-weight: 700; opacity: 0.45;\">ON THE GRIDDLE<\u002Fspan><\u002Fdiv>\n        <div style=\"position: relative; aspect-ratio: 3 / 4; background: rgba(25,21,16,0.055); border: 1px solid rgba(25,21,16,0.2);\"><span style=\"position: absolute; left: 12px; bottom: 10px; font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; font-weight: 700; opacity: 0.45;\">FOIL WRAP<\u002Fspan><\u002Fdiv>\n        <div style=\"position: relative; aspect-ratio: 3 / 4; background: rgba(25,21,16,0.055); border: 1px solid rgba(25,21,16,0.2);\"><span style=\"position: absolute; left: 12px; bottom: 10px; font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; font-weight: 700; opacity: 0.45;\">THE TUBE<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"story\" style=\"background: #FF5A2B; color: #FBF3E2; padding: clamp(52px, 7vw, 108px) clamp(16px, 3vw, 44px);\">\n    <div style=\"max-width: 1020px; margin: 0 auto;\">\n      <p data-reveal=\"1\" style=\"margin: 0 0 12px; font-family: 'Space Mono', monospace; font-size: 11.5px; letter-spacing: 0.14em; font-weight: 700; opacity: 0.8;\">/ WHY WE'RE HERE<\u002Fp>\n      <h2 data-reveal=\"1\" style=\"margin: 0 0 clamp(30px, 4vw, 52px); font-family: 'Archivo Black', sans-serif; font-size: clamp(38px, 7vw, 116px); line-height: 0.85; letter-spacing: -0.05em; text-transform: uppercase;\">MY BREAKFAST.<br><span style=\"color: #191510;\">YOUR MORNING.<\u002Fspan><\u002Fh2>\n\n      <div data-reveal=\"1\" style=\"display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; max-width: 700px; padding-bottom: clamp(28px, 3.6vw, 44px); border-bottom: 1px solid rgba(251,243,226,0.4);\">\n        <div style=\"flex: 0 0 auto; width: 118px; height: 118px; display: flex; align-items: center; justify-content: center;\">\n          <img src=\"6f2a1747-cd4b-4e62-85d5-3b52fd2789bc\" alt=\"Greatfull founder\" style=\"width: 100%; height: 100%; object-fit: contain; display: block;\">\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 260px; min-width: 0;\">\n          <p style=\"margin: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; font-weight: 700; opacity: 0.75;\">HOW THIS STARTED<\u002Fp>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55; font-weight: 500;\">I've made omelets my whole life. Breakfast is the meal I actually look forward to, and folding one into a burrito felt obvious — the tortilla holds what a plate can't. So that's what I do now, ninety times a week.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p data-reveal=\"1\" style=\"margin: clamp(30px, 4vw, 52px) 0 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: clamp(23px, 3vw, 46px); line-height: 1.18; letter-spacing: -0.015em; text-wrap: pretty;\">But this was never really about my mornings. It's about yours. The one where you're already late. The one where you've got nowhere to be at all. The drive home with the whole car smelling like breakfast. Every burrito we fold is built around somebody else's morning — and we're grateful you'd let it be yours.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"peoples\" style=\"background: #14615C; color: #FBF3E2; padding: clamp(52px, 7vw, 108px) clamp(16px, 3vw, 44px);\">\n    <div style=\"max-width: 1380px; margin: 0 auto;\">\n      <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(310px, 100%), 1fr)); gap: clamp(26px, 3.4vw, 64px); align-items: end;\">\n        <div>\n          <p style=\"margin: 0 0 12px; font-family: 'Space Mono', monospace; font-size: 11.5px; letter-spacing: 0.14em; font-weight: 700; color: #F7C93F;\">/ PAY IT FORWARD<\u002Fp>\n          <h2 style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(38px, 7vw, 116px); line-height: 0.84; letter-spacing: -0.05em; text-transform: uppercase;\">PEOPLE'S<br>GREATFULL.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin: 0; max-width: 480px; font-size: clamp(16px, 1.5vw, 20px); line-height: 1.5; opacity: 0.92; text-wrap: pretty;\">Three to five burritos every operating day go to whoever needs one. Buy one at full price and it covers someone else's. We keep a running balance, and the surplus goes to local food banks and community partners.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 0; margin-top: clamp(34px, 4.4vw, 62px);\">\n        <div style=\"padding: clamp(18px, 2vw, 26px) clamp(18px, 2vw, 26px) clamp(20px, 2.2vw, 28px) 0; border-top: 1px solid rgba(251,243,226,0.32);\">\n          <p style=\"margin: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; font-weight: 700; color: #F7C93F;\">01<\u002Fp>\n          <p style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(15px, 1.5vw, 19px); line-height: 1.15; letter-spacing: -0.02em;\">PAY $18,<br>COVER ONE MORE<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: clamp(18px, 2vw, 26px) clamp(18px, 2vw, 26px) clamp(20px, 2.2vw, 28px) 0; border-top: 1px solid rgba(251,243,226,0.32);\">\n          <p style=\"margin: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; font-weight: 700; color: #F7C93F;\">02<\u002Fp>\n          <p style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(15px, 1.5vw, 19px); line-height: 1.15; letter-spacing: -0.02em;\">NO QUESTIONS<br>ASKED<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: clamp(18px, 2vw, 26px) clamp(18px, 2vw, 26px) clamp(20px, 2.2vw, 28px) 0; border-top: 1px solid rgba(251,243,226,0.32);\">\n          <p style=\"margin: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; font-weight: 700; color: #F7C93F;\">03<\u002Fp>\n          <p style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(15px, 1.5vw, 19px); line-height: 1.15; letter-spacing: -0.02em;\">NO<br>JUDGMENT<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: clamp(18px, 2vw, 26px) clamp(18px, 2vw, 26px) clamp(20px, 2.2vw, 28px) 0; border-top: 1px solid rgba(251,243,226,0.32);\">\n          <p style=\"margin: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; font-weight: 700; color: #F7C93F;\">04<\u002Fp>\n          <p style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(15px, 1.5vw, 19px); line-height: 1.15; letter-spacing: -0.02em;\">SURPLUS TO<br>FOOD BANKS<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p data-reveal=\"1\" style=\"margin: clamp(32px, 4v x; border: 1px solid rgba(251,243,226,0.4); border-radius: 999px;\">TAKEOUT ONLY<\u002Fspan>\n            <span style=\"padding: 7px 13px; border: 1px solid rgba(251,243,226,0.4); border-radius: 999px;\">NO DELIVERY<\u002Fspan>\n            <span style=\"padding: 7px 13px; border: 1px solid rgba(251,243,226,0.4); border-radius: 999px;\">CASHLESS<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"list\" style=\"background: #FF5A2B; color: #FBF3E2; padding: clamp(52px, 7vw, 108px) clamp(16px, 3vw, 44px);\">\n    <div style=\"max-width: 900px; margin: 0 auto; text-align: center;\">\n      <p data-reveal=\"1\" style=\"margin: 0 0 18px; font-family: 'Space Mono', monospace; font-size: 11.5px; letter-spacing: 0.16em; font-weight: 700; opacity: 0.85;\">FIRST DROP · {{ dropDate }}<\u002Fp>\n      <h2 data-reveal=\"1\" style=\"margin: 0; font-family: 'Archivo Black', sans-serif; font-size: clamp(38px, 7.2vw, 118px); line-height: 0.85; letter-spacing: -0.05em; text-transform: uppercase;\">{{ formHeading }}<\u002Fh2>\n      <p data-reveal=\"1\" style=\"margin: 20px auto 0; max-width: 560px; font-size: clamp(15.5px, 1.5vw, 19px); line-height: 1.5; opacity: 0.92;\">{{ formNote }}<\u002Fp>\n\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: clamp(28px, 3.6vw, 44px) auto 0; max-width: 620px;\">\n          <input ref=\"{{ emailRef }}\" type=\"email\" required=\"required\" placeholder=\"you@email.com\" aria-label=\"Email address\" style=\"flex: 1 1 260px; min-width: 0; padding: 17px 24px; background: #FBF3E2; border: 1px solid #191510; border-radius: 999px; font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: #191510; outline: none;\" style-focus=\"box-shadow: 4px 4px 0 #191510;\">\n          <button type=\"submit\" style=\"padding: 17px 32px; background: #191510; color: #FBF3E2; border: 1px solid #191510; border-radius: 999px; font-family: 'Archivo Black', sans-serif; font-size: 15.5px; cursor: pointer; transition: transform 0.18s ease, box-shadow 0.18s ease;\" style-hover=\"transform: translate(-3px, -3px); box-shadow: 5px 5px 0 rgba(25,21,16,0.5);\">{{ ctaLabel }}<\u002Fbutton>\n        <\u002Fform>\n        <p style=\"margin: 14px 0 0; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; opacity: 0.7;\">ONE EMAIL A WEEK, MAX. NO NEWSLETTER NONSENSE.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin: clamp(28px, 3.6vw, 44px) auto 0; max-width: 560px; background: #FBF3E2; color: #191510; padding: 32px;\">\n          <p style=\"margin: 0 0 10px; font-family: 'Archivo Black', sans-serif; font-size: clamp(24px, 2.8vw, 38px); line-height: 0.95; letter-spacing: -0.035em;\">YOU'RE ON THE LIST.<\u002Fp>\n          <p style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.3;\">Slots drop Wednesday at noon. We're grateful you're here.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: clamp(52px, 7vw, 100px) clamp(16px, 3vw, 44px);\">\n    <div style=\"max-width: 1020px; margin: 0 auto;\">\n      <h2 data-reveal=\"1\" style=\"margin: 0 0 clamp(26px, 3.4vw, 44px); font-family: 'Archivo Black', sans-serif; font-size: clamp(34px, 6vw, 96px); line-height: 0.86; letter-spacing: -0.05em; text-transform: uppercase;\">QUESTIONS,<br>ANSWERED FAST.<\u002Fh2>\n\n      <details style=\"border-top: 1.5px solid #191510; padding: 19px 0;\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 20px; cursor: pointer; font-family: 'Archivo Black', sans-serif; font-size: clamp(17px, 1.9vw, 25px); letter-spacing: -0.025em;\">DO YOU DELIVER?<span style=\"font-family: 'Space Mono', monospace; font-size: 20px; opacity: 0.5;\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin: 13px 0 0; font-size: 16px; line-height: 1.6; max-width: 700px; opacity: 0.85;\">No. It's best six minutes out of the pan — half an hour in someone else's car ruins the whole point. The tube keeps it hot on your way home, not on a delivery route.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top: 1.5px solid #191510; padding: 19px 0;\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 20px; cursor: pointer; font-family: 'Archivo Black', sans-serif; font-size: clamp(17px, 1.9vw, 25px); letter-spacing: -0.025em;\">CAN I EAT THERE?<span style=\"font-family: 'Space Mono', monospace; font-size: 20px; opacity: 0.5;\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin: 13px 0 0; font-size: 16px; line-height: 1.6; max-width: 700px; opacity: 0.85;\">There is nowhere to sit, on purpose. Every dollar goes into the food instead of chairs.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top: 1.5px solid #191510; padding: 19px 0;\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 20px; cursor: pointer; font-family: 'Archivo Black', sans-serif; font-size: clamp(17px, 1.9vw, 25px); letter-spacing: -0.025em;\">WHAT'S AN OMULET?<span style=\"font-family: 'Space Mono', monospace; font-size: 20px; opacity: 0.5;\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin: 13px 0 0; font-size: 16px; line-height: 1.6; max-width: 700px; opacity: 0.85;\">A thin, hand-folded egg omelet named for omurice, the Japanese diner classic it borrows from — normally wrapped around rice. Ours skips the rice; the burrito's already doing that job. Just the omelet, right at the center.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top: 1.5px solid #191510; padding: 19px 0;\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 20px; cursor: pointer; font-family: 'Archivo Black', sans-serif; font-size: clamp(17px, 1.9vw, 25px); letter-spacing: -0.025em;\">IS EVERYTHING VEGETARIAN?<span style=\"font-family: 'Space Mono', monospace; font-size: 20px; opacity: 0.5;\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin: 13px 0 0; font-size: 16px; line-height: 1.6; max-width: 700px; opacity: 0.85;\">All of it, always. No meat on the menu and none planned — the chorizo in Papi is ours, made from scratch. Going vegan? Swap in the silken tofu omulet with vegan cheese or cashew crema. Any flavour, no upcharge.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top: 1.5px solid #191510; padding: 19px 0;\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 20px; cursor: pointer; font-family: 'Archivo Black', sans-serif; font-size: clamp(17px, 1.9vw, 25px); letter-spacing: -0.025em;\">WHY ONLY NINETY A WEEK?<span style=\"font-family: 'Space Mono', monospace; font-size: 20px; opacity: 0.5;\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin: 13px 0 0; font-size: 16px; line-height: 1.6; max-width: 700px; opacity: 0.85;\">Thirty a day, Friday through Sunday. That's what two hands and a 72-hour dough can honestly do. When they're gone, they're gone until next Friday.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top: 1.5px solid #191510; border-bottom: 1.5px solid #191510; padding: 19px 0;\">\n        <summary style=\"display: flex; justify-content: space-between; align-items: center; gap: 20px; cursor: pointer; font-family: 'Archivo Black', sans-serif; font-size: clamp(17px, 1.9vw, 25px); letter-spacing: -0.025em;\">IS ONE ENOUGH?<span style=\"font-family: 'Space Mono', monospace; font-size: 20px; opacity: 0.5;\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin: 13px 0 0; font-size: 16px; line-height: 1.6; max-width: 700px; opacit  {\n    const calm =\n      (this.props.motion ?? \"full\") === \"calm\" ||\n      window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n    if (calm) {\n      document.querySelectorAll(\"[data-motion]\").forEach((el) => {\n        el.style.animation = \"none\";\n      });\n      return;\n    }\n\n    const reveals = [...document.querySelectorAll(\"[data-reveal]\")];\n    const vh = window.innerHeight;\n    const hidden = reveals.filter((el) => el.getBoundingClientRect().top > vh * 0.86);\n    hidden.forEach((el) => {\n      el.style.transition = \"opacity 0.6s ease, transform 0.6s cubic-bezier(0.2,0.8,0.2,1)\";\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(26px)\";\n    });\n    this._io = new IntersectionObserver(\n      (entries) => {\n        entries.forEach((entry) => {\n          if (!entry.isIntersecting) return;\n          entry.target.style.opacity = \"1\";\n          entry.target.style.transform = \"translateY(0)\";\n          this._io.unobserve(entry.target);\n        });\n      },\n      { rootMargin: \"0px 0px -12% 0px\", threshold: 0.05 }\n    );\n    hidden.forEach((el) => this._io.observe(el));\n\n    const scrubbed = [...document.querySelectorAll(\"[data-scrub]\")].map((el) => ({\n      el,\n      kind: el.getAttribute(\"data-scrub\"),\n    }));\n    let raf = null;\n    this._onScroll = () => {\n      if (raf) return;\n      raf = requestAnimationFrame(() => {\n        raf = null;\n        const y = window.scrollY;\n        scrubbed.forEach(({ el, kind }) => {\n          const k = kind === \"slow\" ? 0.1 : -0.14;\n          el.style.transform = \"translateY(\" + y * k + \"px)\";\n        });\n      });\n    };\n    window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._onScroll) window.removeEventListener(\"scroll\", this._onScroll);\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><
